name: Build & Release DMG

on:
  push:
    branches: ["**"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Extract version info
        id: meta
        run: |
          VERSION=$(grep 'MARKETING_VERSION' modelhub.xcodeproj/project.pbxproj \
            | head -1 | sed 's/.*= //;s/;//;s/[[:space:]]//g')
          SHORT_SHA="${GITHUB_SHA:0:8}"
          VERSION="${VERSION:-1.0.0}"
          echo "version=$VERSION"                              >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-${SHORT_SHA}"                 >> "$GITHUB_OUTPUT"
          echo "dmg=ModelHub-${VERSION}-${SHORT_SHA}.dmg"     >> "$GITHUB_OUTPUT"
          echo "release_name=ModelHub ${VERSION} (${SHORT_SHA})" >> "$GITHUB_OUTPUT"

      - name: Build (Release, unsigned)
        run: |
          xcodebuild \
            -project modelhub.xcodeproj \
            -target modelhub \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Ad-hoc sign
        run: |
          # Ad-hoc signing (-) lets the app run locally without a paid
          # Developer ID certificate. Recipients will need to right-click
          # → Open (or run: xattr -dr com.apple.quarantine ModelHub.app)
          # to bypass Gatekeeper on first launch.
          codesign --force --deep --sign - build/Release/modelhub.app

      - name: Create DMG
        run: |
          STAGING=$(mktemp -d)
          cp -r build/Release/modelhub.app "$STAGING/ModelHub.app"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create \
            -volname "ModelHub" \
            -srcfolder "$STAGING" \
            -ov \
            -format UDZO \
            "${{ steps.meta.outputs.dmg }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.release_name }}
          prerelease: true
          body: |
            Built from [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) on branch `${{ github.ref_name }}`.

            ### Install
            1. Open the DMG
            2. Drag **ModelHub.app** into Applications

            > ⚠️ **Unsigned build.** Right-click → **Open** on first launch to bypass Gatekeeper, or run:
            > ```sh
            > xattr -dr com.apple.quarantine /Applications/ModelHub.app
            > ```
          files: ${{ steps.meta.outputs.dmg }}
